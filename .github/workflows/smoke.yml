name: smoke

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node packages/cli/dist/index.js doctor
      - run: node packages/cli/dist/index.js run --url https://example.com --instruction "Extract the main heading and first paragraph as markdown" --wait
