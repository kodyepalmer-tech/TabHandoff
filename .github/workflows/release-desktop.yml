name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Attach artifacts to a GitHub Release for this ref (tag recommended)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json "packageManager" (avoid dual-version error)

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build workspace
        run: pnpm build

      - name: Package desktop (${{ matrix.script }})
        working-directory: packages/desktop
        env:
          # Unsigned OSS builds — founder can add CSC_* later for signing
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm ${{ matrix.script }}

      - name: Checksums
        if: runner.os == 'Linux'
        working-directory: packages/desktop
        run: pnpm checksums

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            packages/desktop/release/*.*
            !packages/desktop/release/*-unpacked/**
            !packages/desktop/release/builder-*.yml
            !packages/desktop/release/*.blockmap
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: desktop-*
          merge-multiple: true

      - name: List artifacts + SHA256SUMS (all platforms)
        # Rebuild checksums for the merged set; exclude any per-OS SHA256SUMS
        # uploaded from the Linux job so it is not hashed into itself.
        run: |
          set -euo pipefail
          ls -la dist
          cd dist
          rm -f SHA256SUMS
          if command -v sha256sum >/dev/null; then
            sha256sum * > SHA256SUMS
          else
            shasum -a 256 * > SHA256SUMS
          fi
          cat SHA256SUMS

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
