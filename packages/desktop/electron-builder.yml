appId: app.tabhandoff.desktop
productName: TabHandoff
copyright: Copyright © TabHandoff contributors
artifactName: TabHandoff-${version}-${os}-${arch}.${ext}
directories:
  app: release-stage
  output: release
  buildResources: build
files:
  - "**/*"
asar: true
asarUnpack:
  - "**/{playwright,playwright-core}/**"
linux:
  category: Utility
  maintainer: TabHandoff <hello@tabhandoff.com>
  vendor: TabHandoff
  synopsis: Hand off any browser tab. Pick up anywhere.
  description: Local-first evidence library and bridge for the TabHandoff open handoff protocol.
  desktop:
    entry:
      Name: TabHandoff
      Comment: Hand off any browser tab. Pick up anywhere.
      Categories: Utility;
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  executableName: TabHandoff
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TabHandoff
dmg:
  artifactName: TabHandoff-${version}-mac-${arch}.${ext}
publish:
  - provider: github
    owner: kodyepalmer-tech
    repo: TabHandoff
    releaseType: release
