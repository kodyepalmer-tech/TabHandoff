<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="TabHandoff">
  <title>TabHandoff</title>
  <!-- Exact app-icon composition: black squircle + two tab frames + one curved handoff arrow -->
  <rect width="1024" height="1024" rx="224" fill="#000000"/>
  <!-- Left tab -->
  <rect x="248" y="288" width="200" height="448" rx="56" fill="none" stroke="#FFFFFF" stroke-width="56"/>
  <!-- Right tab -->
  <rect x="576" y="288" width="200" height="448" rx="56" fill="none" stroke="#FFFFFF" stroke-width="56"/>
  <!-- Handoff curve + arrowhead (left → right) -->
  <path d="M448 512 C496 400 528 400 576 512" fill="none" stroke="#FFFFFF" stroke-width="56" stroke-linecap="round"/>
  <path d="M548 456 L596 512 L548 512 Z" fill="#FFFFFF"/>
</svg>
