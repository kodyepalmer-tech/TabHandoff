  <!-- Bottom arrow ← -->
  <path d="M768 624 H344" stroke="#FFFFFF" stroke-width="72" stroke-linecap="round"/>
  <path d="M404 544 L256 624 L404 704" fill="none" stroke="#FFFFFF" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
