<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #000;
      color: #fff;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      padding: 72px;
      gap: 56px;
    }
    .mark {
      width: 200px;
      height: 200px;
      border-radius: 44px;
      flex-shrink: 0;
    }
    .brand {
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 18px;
    }
    .tag {
      font-size: 28px;
      line-height: 1.3;
      opacity: 0.78;
      max-width: 720px;
      margin-bottom: 28px;
    }
    .url { font-size: 20px; opacity: 0.55; }
  </style>
</head>
<body>
  <img class="mark" src="./tabhandoff-logo.png" alt="TabHandoff" />
  <div>
    <div class="brand">TabHandoff</div>
    <div class="tag">Your AI was here. Now the next one can pick up.</div>
    <div class="url">github.com/kodyepalmer-tech/TabHandoff</div>
  </div>
</body>
</html>
